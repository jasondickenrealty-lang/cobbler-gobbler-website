runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  # Public Firebase config (baked into client bundle)
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    value: "AIzaSyANRgxNQe16pM9pb2BaORbJkQvPoHP_eR8"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    value: "cobblestone-pos.firebaseapp.com"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    value: "cobblestone-pos"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    value: "cobblestone-pos.firebasestorage.app"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    value: "379924075336"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    value: "1:379924075336:web:402c8b323ffcb43b4f197d"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_API_BASE
    value: "https://us-central1-cobblestone-pos.cloudfunctions.net/api"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_ORDER_ONLINE_URL
    value: "https://order.cobblestonecreamery.com/auth"
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_WHOLESALE_URL
    value: "https://wholesale.cobblestonecreamery.com"
    availability:
      - BUILD
      - RUNTIME

  # Server-side secrets — set these via:
  #   firebase apphosting:secrets:set FACEBOOK_APP_ID --project cobblestone-pos
  #   firebase apphosting:secrets:set FACEBOOK_APP_SECRET --project cobblestone-pos
  #   firebase apphosting:secrets:set SUPPORT_RELAY_URL --project cobblestone-pos
  #   firebase apphosting:secrets:set SUPPORT_RELAY_TOKEN --project cobblestone-pos
  #   firebase apphosting:secrets:set JOB_APPLICATION_API_BASE --project cobblestone-pos  (optional, falls back to NEXT_PUBLIC_API_BASE)
  - variable: FACEBOOK_APP_ID
    secret: FACEBOOK_APP_ID
    availability:
      - RUNTIME
  - variable: FACEBOOK_APP_SECRET
    secret: FACEBOOK_APP_SECRET
    availability:
      - RUNTIME
  - variable: FACEBOOK_REDIRECT_URI
    secret: FACEBOOK_REDIRECT_URI
    availability:
      - RUNTIME
  - variable: SUPPORT_RELAY_URL
    secret: SUPPORT_RELAY_URL
    availability:
      - RUNTIME
  - variable: SUPPORT_RELAY_TOKEN
    secret: SUPPORT_RELAY_TOKEN
    availability:
      - RUNTIME
