runConfig:
  minInstances: 0
  maxInstances: 10
  concurrency: 80
  cpu: 1
  memoryMiB: 512

env:
  - variable: NEXT_PUBLIC_FIREBASE_API_KEY
    secret: NEXT_PUBLIC_FIREBASE_API_KEY
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    secret: NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    secret: NEXT_PUBLIC_FIREBASE_PROJECT_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    secret: NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    secret: NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_FIREBASE_APP_ID
    secret: NEXT_PUBLIC_FIREBASE_APP_ID
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_API_BASE
    secret: NEXT_PUBLIC_API_BASE
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_ORDER_ONLINE_URL
    secret: NEXT_PUBLIC_ORDER_ONLINE_URL
    availability:
      - BUILD
      - RUNTIME
  - variable: NEXT_PUBLIC_WHOLESALE_URL
    secret: NEXT_PUBLIC_WHOLESALE_URL
    availability:
      - BUILD
      - RUNTIME
  - variable: FACEBOOK_APP_ID
    secret: FACEBOOK_APP_ID
    availability:
      - RUNTIME
  - variable: FACEBOOK_APP_SECRET
    secret: FACEBOOK_APP_SECRET
    availability:
      - RUNTIME
  - variable: FACEBOOK_REDIRECT_URI
    secret: FACEBOOK_REDIRECT_URI
    availability:
      - RUNTIME
  - variable: SUPPORT_RELAY_URL
    secret: SUPPORT_RELAY_URL
    availability:
      - RUNTIME
  - variable: SUPPORT_RELAY_TOKEN
    secret: SUPPORT_RELAY_TOKEN
    availability:
      - RUNTIME
